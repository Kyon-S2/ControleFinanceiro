name: CI — Testes Backend .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Rodar Testes .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore backend/ControleFinanceiro.slnx

      - name: Compilar
        run: dotnet build backend/ControleFinanceiro.slnx --no-restore

      - name: Rodar testes
        run: dotnet test backend/ControleFinanceiro.slnx --no-build --verbosity normal
